<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edzes — Open Workout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'IBM Plex Mono', monospace; }
    .font-display { font-family: 'Oswald', sans-serif; }
    .bg-noise {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    }
    .rest-pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    .animate-slide-in { animation: slideIn 0.25s ease-out both; }
    input[type=number]::-webkit-inner-spin-button { opacity: 0.3; }
    input[type=number]:focus::-webkit-inner-spin-button { opacity: 1; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen bg-noise" x-data="workoutApp()" x-init="init()">

  <!-- PR Toast -->
  <div x-show="showPrToast" x-transition
       class="fixed top-4 left-1/2 -translate-x-1/2 bg-amber-400 text-black px-6 py-3 rounded font-display font-700 text-lg uppercase tracking-wide z-50 shadow-lg shadow-amber-400/20">
    Uj egyeni rekord!
  </div>

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-950/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-8 w-1 rounded-full" :style="`background: ${workout?.color || '#ef4444'}`"></div>
        <h1 class="font-display text-xl font-600 uppercase tracking-wide" x-text="workout?.name || 'Edzes'"></h1>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-zinc-500 text-sm font-medium tabular-nums" x-text="formatDuration(elapsedSeconds)"></span>
        <button @click="discardWorkout()"
                class="px-3 py-1.5 text-[10px] font-medium uppercase tracking-widest text-zinc-600 border border-zinc-700 rounded hover:text-zinc-300 hover:border-zinc-500 transition">
          Eldobas
        </button>
        <button @click="finishWorkout()"
                class="px-3 py-1.5 text-[10px] font-medium uppercase tracking-widest text-red-400 border border-red-400/30 rounded hover:bg-red-400 hover:text-black transition"
                :disabled="finishing">
          Befejezes
        </button>
      </div>
    </div>
    <!-- Progress bar -->
    <div class="h-1 bg-zinc-800">
      <div class="h-full transition-all duration-500 ease-out"
           :style="`width: ${exerciseProgress}%; background: ${workout?.color || '#ef4444'}`"></div>
    </div>
  </header>

  <div class="max-w-5xl mx-auto p-4 flex flex-row gap-4">

    <!-- Exercise sidebar -->
    <div class="w-[72px] lg:w-72 space-y-1 flex-shrink-0 transition-all duration-200">
      <template x-for="(ex, i) in workout?.exercises || []" :key="i">
        <div @click="switchExercise(i)"
             class="flex items-center lg:flex-row flex-col gap-1 lg:gap-3 px-1 lg:px-3 py-2 lg:py-2.5 rounded-lg cursor-pointer transition-all duration-200"
             :class="[
               i === currentExerciseIndex ? 'bg-zinc-800' : 'hover:bg-zinc-800/50',
               isExerciseDone(i) && 'bg-emerald-950/40 ring-1 ring-emerald-800/40'
             ]">
          <div class="w-9 h-9 rounded flex-shrink-0 border transition overflow-hidden relative flex items-center justify-center"
               :class="[
                 isExerciseDone(i) ? 'bg-emerald-900/30 border-emerald-700/50' : 'bg-zinc-800',
                 i === currentExerciseIndex ? 'border-zinc-600' : (!isExerciseDone(i) && 'border-zinc-800')
               ]">
            <img x-show="allExerciseImages[ex.name]?.length > 0"
                 :src="allExerciseImages[ex.name]?.[0]?.url"
                 class="absolute inset-0 w-full h-full object-cover">
            <img x-show="!(allExerciseImages[ex.name]?.length > 0) && ex.image"
                 :src="ex.image" class="w-6 h-6 transition"
                 :style="`color: ${i === currentExerciseIndex ? (workout?.color || '#ef4444') : '#52525b'}`">
            <!-- Done check overlay on icon -->
            <div x-show="isExerciseDone(i)" class="absolute inset-0 bg-emerald-500/20 flex items-center justify-center">
              <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
            </div>
          </div>
          <!-- Compact name on small screens -->
          <div class="lg:hidden text-center w-full min-w-0">
            <div class="text-[9px] leading-tight font-medium truncate px-0.5"
                 :class="isExerciseDone(i) ? 'text-emerald-400' : (i === currentExerciseIndex ? 'text-zinc-300' : 'text-zinc-600')"
                 x-text="ex.name"></div>
          </div>
          <!-- Full name on large screens -->
          <div class="flex-1 min-w-0 hidden lg:block">
            <div class="text-sm font-medium truncate"
                 :class="isExerciseDone(i) ? 'text-emerald-400' : (i === currentExerciseIndex ? 'text-zinc-100' : 'text-zinc-500')"
                 x-text="ex.name"></div>
            <div class="text-[10px] uppercase tracking-wider"
                 :class="isExerciseDone(i) ? 'text-emerald-500' : (getCompletedCount(i) > 0 ? 'text-emerald-500' : 'text-zinc-700')"
                 x-text="isExerciseDone(i) ? 'Kesz' : getCompletedCount(i) + ' kesz'"></div>
          </div>
        </div>
      </template>

      <a x-show="workout?.youtubeUrl" :href="workout?.youtubeUrl" target="_blank"
         class="flex items-center gap-2 mt-4 px-3 py-2 text-zinc-600 hover:text-red-400 transition text-xs">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
        <span class="hidden lg:inline">Tutorial video</span>
      </a>
    </div>

    <!-- Main panel -->
    <div class="flex-1 min-w-0">
      <template x-if="currentExercise">
        <div class="space-y-6">

          <!-- Exercise header with image carousel -->
          <div class="flex items-start gap-6 bg-zinc-900 rounded-lg border border-zinc-800 p-6">
            <div class="relative w-28 h-28 rounded-lg bg-zinc-800 flex items-center justify-center flex-shrink-0 border border-zinc-700 overflow-hidden group/img">
              <!-- Uploaded images carousel -->
              <template x-if="exerciseImages.length > 0">
                <div class="relative w-full h-full">
                  <img :src="exerciseImages[carouselIndex]?.url" class="w-full h-full object-contain transition-opacity duration-500">
                  <!-- Nav arrows -->
                  <button x-show="exerciseImages.length > 1" @click="prevImage($event)"
                          class="absolute left-0 top-0 h-full w-1/3 opacity-0 group-hover/img:opacity-100 transition flex items-center justify-start pl-1">
                    <svg class="w-3 h-3 text-white drop-shadow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/></svg>
                  </button>
                  <button x-show="exerciseImages.length > 1" @click="nextImage($event)"
                          class="absolute right-0 top-0 h-full w-1/3 opacity-0 group-hover/img:opacity-100 transition flex items-center justify-end pr-1">
                    <svg class="w-3 h-3 text-white drop-shadow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>
                  </button>
                  <!-- Dots -->
                  <div x-show="exerciseImages.length > 1" class="absolute bottom-1 left-0 right-0 flex justify-center gap-1">
                    <template x-for="(img, di) in exerciseImages" :key="di">
                      <div class="w-1 h-1 rounded-full transition" :class="di === carouselIndex ? 'bg-white' : 'bg-white/40'"></div>
                    </template>
                  </div>
                </div>
              </template>
              <!-- Fallback SVG icon -->
              <template x-if="exerciseImages.length === 0">
                <img x-show="currentExercise.image" :src="currentExercise.image" class="w-14 h-14" :style="`color: ${workout?.color || '#ef4444'}`">
              </template>
              <!-- Upload button -->
              <button @click="$refs.imgPicker.click()"
                      class="absolute inset-0 flex items-center justify-center bg-black/50 opacity-0 group-hover/img:opacity-100 transition">
                <svg class="w-5 h-5 text-zinc-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
              </button>
              <input type="file" x-ref="imgPicker" accept="image/*" class="hidden" @change="uploadImage($event)">
            </div>
            <div>
              <div class="flex items-center gap-3">
                <h2 class="font-display text-3xl font-600 uppercase tracking-wide" x-text="currentExercise.name"></h2>
                <a x-show="currentExercise.youtubeUrl" :href="currentExercise.youtubeUrl" target="_blank"
                   class="text-zinc-600 hover:text-red-400 transition flex-shrink-0" title="Tutorial video">
                  <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
                </a>
              </div>
              <div class="flex items-center gap-3 mt-1">
                <span class="text-xs uppercase tracking-wider text-zinc-500" x-text="currentExercise.equipment"></span>
                <span class="text-xs tabular-nums text-zinc-600 flex items-center gap-1">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  <span x-text="formatDuration(exerciseElapsed)"></span>
                </span>
              </div>
              <template x-if="currentExercise.notes">
                <p class="text-sm text-zinc-400 mt-2 leading-relaxed" x-text="currentExercise.notes"></p>
              </template>
              <!-- User note -->
              <div class="mt-3">
                <textarea
                  x-model="exerciseNote"
                  @blur="saveExerciseNote(currentExercise?.name)"
                  placeholder="Megjegyzés..."
                  rows="2"
                  class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-sm text-zinc-300 placeholder-zinc-600 resize-none focus:outline-none focus:border-zinc-500 transition"
                ></textarea>
                <span x-show="noteSaving" class="text-[10px] text-zinc-600 mt-1 block">Mentés...</span>
              </div>
            </div>
          </div>

          <!-- Exercise history -->
          <template x-if="currentExercise && exerciseHistory[currentExercise.name]?.length > 0">
            <div class="space-y-1">
              <button @click="historyVisible = !historyVisible"
                      class="text-[10px] uppercase tracking-[0.2em] text-zinc-600 hover:text-zinc-400 transition">
                <span x-text="historyVisible ? 'Elozmeny ▲' : 'Elozmeny ▼'"></span>
              </button>
              <div x-show="historyVisible" x-transition class="bg-zinc-900 border border-zinc-800 rounded-lg p-3">
                <canvas class="w-full" style="height:120px" :id="'hist-' + currentExercise.name.replace(/\s/g, '-')"></canvas>
              </div>
            </div>
          </template>

          <!-- Rest timer -->
          <div x-show="timerRunning" class="bg-zinc-900 border border-zinc-800 rounded-lg p-6 text-center space-y-3 rest-pulse">
            <p class="text-xs uppercase tracking-[0.2em] text-zinc-500">Piheno</p>
            <div class="relative inline-block">
              <svg class="w-28 h-28 transform -rotate-90" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="54" fill="none" stroke="#27272a" stroke-width="6"/>
                <circle cx="60" cy="60" r="54" fill="none" stroke-width="6"
                        :stroke="workout?.color || '#ef4444'"
                        :stroke-dasharray="339.29"
                        :stroke-dashoffset="339.29 * (1 - timerSeconds / timerTotal)"
                        stroke-linecap="round"/>
              </svg>
              <span class="absolute inset-0 flex items-center justify-center text-2xl font-display font-600 tabular-nums"
                    x-text="timerSeconds + 's'"></span>
            </div>
            <button @click="skipRest()"
                    class="text-xs uppercase tracking-widest text-zinc-500 hover:text-zinc-300 transition">
              Atugrasa
            </button>
          </div>

          <!-- Sets list -->
          <div class="space-y-2">
            <div class="flex items-center justify-between px-1 mb-1">
              <h3 class="text-[10px] uppercase tracking-[0.2em] text-zinc-600 font-medium">Setek</h3>
            </div>

            <template x-for="(set, si) in exerciseSets" :key="si">
              <div @click="toggleSet(si)"
                   @mousedown="startDrag($event, si)" @touchstart="startDrag($event, si)"
                   class="animate-slide-in flex items-center gap-3 px-4 py-3 rounded-lg border transition-all duration-200 cursor-pointer select-none relative overflow-hidden"
                   :class="[
                     set.done
                       ? (set.isWarmup ? 'bg-amber-950/20 border-amber-800/30' : 'bg-emerald-950/30 border-emerald-800/50')
                       : 'bg-zinc-900 border-zinc-800 hover:border-zinc-700',
                     set.isWarmup && !set.done && 'opacity-70'
                   ]"
                   :style="`animation-delay: ${si * 50}ms; transform: translateX(${set._dragX || 0}px)`">
                <!-- Drag weight indicator -->
                <div x-show="set._dragDelta" class="absolute inset-0 flex items-center pointer-events-none z-10"
                     :class="set._dragDelta > 0 ? 'justify-end pr-6' : 'justify-start pl-6'">
                  <span class="text-lg font-display font-700"
                        :class="set._dragDelta > 0 ? 'text-emerald-400' : 'text-red-400'"
                        x-text="(set._dragDelta > 0 ? '+' : '') + (set._dragDelta * 2.5) + ' kg'"></span>
                </div>
                <!-- Check -->
                <div class="flex-shrink-0 w-6 h-6 rounded border-2 flex items-center justify-center transition-all duration-200 pointer-events-none"
                     :class="set.done
                       ? (set.isWarmup ? 'bg-amber-500 border-amber-500' : 'bg-emerald-500 border-emerald-500')
                       : 'border-zinc-600'">
                  <svg x-show="set.done" class="w-3.5 h-3.5 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                  </svg>
                </div>
                <!-- Warmup toggle / Set # -->
                <button @click.stop="if(!set.done) set.isWarmup = !set.isWarmup"
                        class="text-[10px] uppercase tracking-wider w-10 text-left"
                        :class="set.isWarmup ? 'text-amber-400 font-bold' : (set.done ? 'text-emerald-600' : 'text-zinc-600')"
                        x-text="set.isWarmup ? 'W' : 'S' + (si + 1)"></button>
                <!-- Weight -->
                <input type="number" x-model.number="set.weight" step="0.5"
                       @click.stop
                       :disabled="set.done"
                       class="w-24 bg-zinc-800 border border-zinc-700 rounded px-3 py-2.5 text-center text-base font-medium focus:ring-1 focus:ring-zinc-500 outline-none disabled:opacity-40 disabled:border-transparent"
                       :class="set.done && 'bg-emerald-900/20 border-transparent'">
                <span class="text-[10px] text-zinc-600">kg</span>
                <!-- Reps -->
                <input type="number" x-model.number="set.reps"
                       @click.stop
                       :disabled="set.done"
                       class="w-20 bg-zinc-800 border border-zinc-700 rounded px-3 py-2.5 text-center text-base font-medium focus:ring-1 focus:ring-zinc-500 outline-none disabled:opacity-40 disabled:border-transparent"
                       :class="set.done && 'bg-emerald-900/20 border-transparent'">
                <span class="text-[10px] text-zinc-600">x</span>
                <!-- 1RM -->
                <span x-show="!set.isWarmup && set.weight > 0 && set.reps > 0 && set.reps < 37"
                      class="text-[10px] text-zinc-600 tabular-nums hidden sm:inline"
                      x-text="'~' + Math.round(set.weight * 36 / (37 - set.reps)) + ' 1RM'"></span>
                <!-- PR -->
                <span x-show="set.isPr" class="text-[10px] uppercase tracking-wider text-amber-400 font-medium">PR</span>
                <!-- Delete -->
                <button @click.stop="removeSet(si)"
                        class="ml-auto text-zinc-700 hover:text-red-400 transition disabled:opacity-30">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>
              </div>
            </template>

            <!-- Next exercise / Finish button -->
            <template x-if="allCurrentSetsDone && !timerRunning">
              <div class="mt-4 animate-slide-in space-y-2">
                <template x-if="allExercisesDone">
                  <div>
                    <button @click="clearAutoAdvance(); finishWorkout()"
                            class="w-full py-3.5 text-sm font-display font-600 uppercase tracking-widest text-black rounded-lg transition relative overflow-hidden"
                            :style="`background: ${workout?.color || '#ef4444'}`">
                      <span x-show="autoAdvanceSeconds > 0" x-text="`Befejezes (${autoAdvanceSeconds}s)`"></span>
                      <span x-show="autoAdvanceSeconds <= 0">Befejezes</span>
                    </button>
                  </div>
                </template>
                <template x-if="!allExercisesDone">
                  <div>
                    <button @click="goNextExercise()"
                            class="w-full py-3.5 text-sm font-display font-600 uppercase tracking-widest bg-zinc-800 text-zinc-100 rounded-lg hover:bg-zinc-700 transition">
                      <span x-show="autoAdvanceSeconds > 0" x-text="`Kovetkezo gyakorlat (${autoAdvanceSeconds}s)`"></span>
                      <span x-show="autoAdvanceSeconds <= 0">Kovetkezo gyakorlat</span>
                    </button>
                    <button x-show="autoAdvanceSeconds > 0" @click="clearAutoAdvance()"
                            class="w-full py-1.5 text-[10px] uppercase tracking-widest text-zinc-600 hover:text-zinc-400 transition">
                      Megsem / Maradok
                    </button>
                  </div>
                </template>
              </div>
            </template>

            <!-- Add set (always visible) -->
            <button @click="addSet()"
                    class="w-full py-2.5 text-[10px] uppercase tracking-[0.2em] text-zinc-700 border border-dashed border-zinc-800 rounded-lg hover:border-zinc-600 hover:text-zinc-400 transition">
              + Set hozzaadasa
            </button>
          </div>

        </div>
      </template>
    </div>
  </div>

  <!-- Clock bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-zinc-950/90 backdrop-blur border-t border-zinc-800 flex justify-center py-2 pointer-events-none">
    <span class="font-display font-700 text-7xl tabular-nums tracking-widest text-zinc-100" x-text="clockTime"></span>
  </div>
  <!-- Spacer so content isn't hidden behind clock bar -->
  <div class="h-28"></div>

  <script>
    function workoutApp() {
      return {
        sessionId: null, workout: null, session: null, lastSession: null,
        currentExerciseIndex: 0, allSets: {},
        elapsedSeconds: 0, elapsedInterval: null,
        timerSeconds: 0, timerTotal: 0, timerRunning: false, timerInterval: null,
        showPrToast: false, finishing: false, ready: false,
        exerciseImages: [], carouselIndex: 0, carouselInterval: null, uploading: false,
        allExerciseImages: {},
        autoAdvanceSeconds: 0, autoAdvanceInterval: null,
        exerciseTimes: {}, exerciseStartedAt: null, exerciseElapsed: 0, exerciseTimerInterval: null,
        exerciseHistory: {}, historyVisible: false, historyChart: null,
        exerciseNote: '', noteSaving: false,
        clockTime: '',

        get currentExercise() { return this.workout?.exercises?.[this.currentExerciseIndex]; },
        get exerciseSets() {
          const ex = this.currentExercise;
          if (!ex) return [];
          return this.allSets[ex.name] || [];
        },
        get allCurrentSetsDone() {
          const sets = this.exerciseSets.filter(s => !s.isWarmup);
          return sets.length > 0 && sets.every(s => s.done);
        },
        get exerciseProgress() {
          if (!this.workout) return 0;
          const done = this.workout.exercises.filter((ex, i) => this.isExerciseDone(i)).length;
          return (done / this.workout.exercises.length) * 100;
        },
        get allExercisesDone() {
          if (!this.workout) return false;
          return this.workout.exercises.every(ex => {
            const sets = (this.allSets[ex.name] || []).filter(s => !s.isWarmup);
            return sets.length > 0 && sets.every(s => s.done);
          });
        },

        async init() {
          const params = new URLSearchParams(window.location.search);
          this.sessionId = params.get('id');
          if (!this.sessionId) { window.location.href = '/'; return; }

          const [sessionRes, workoutsRes] = await Promise.all([
            fetch(`/api/sessions/${this.sessionId}`).then(r => r.json()),
            fetch('/api/workouts').then(r => r.json())
          ]);

          this.session = sessionRes;
          this.workout = workoutsRes.find(w => w.id === sessionRes.workout_id);
          this.lastSession = await fetch(`/api/workouts/${sessionRes.workout_id}/last-session`).then(r => r.json());

          for (const ex of this.workout.exercises) {
            const existing = (sessionRes.sets || []).filter(s => s.exercise_name === ex.name);
            const lastSets = (this.lastSession?.sets || []).filter(s => s.exercise_name === ex.name);

            if (existing.length > 0) {
              this.allSets[ex.name] = existing.map(s => ({
                id: s.id, weight: Number(s.weight), reps: s.reps,
                done: true, saved: true, isPr: false, saving: false, isWarmup: s.is_warmup || false
              }));
              const lw = Number(existing[existing.length - 1].weight);
              const lr = existing[existing.length - 1].reps;
              this.allSets[ex.name].push({ weight: lw, reps: lr, done: false, saved: false, isPr: false, saving: false, isWarmup: false });
            } else if (lastSets.length > 0) {
              this.allSets[ex.name] = lastSets.map(s => ({
                weight: Number(s.weight), reps: s.reps, done: false, saved: false, isPr: false, saving: false, isWarmup: false
              }));
            } else {
              const count = ex.defaultSets || 3;
              this.allSets[ex.name] = Array.from({ length: count }, () => ({
                weight: ex.defaultWeight || 0, reps: ex.defaultReps || 0,
                done: false, saved: false, isPr: false, saving: false, isWarmup: false
              }));
            }
          }

          await Promise.all(this.workout.exercises.map(ex =>
            fetch(`/api/exercises/${encodeURIComponent(ex.name)}/images`).then(r => r.json())
              .then(data => { this.allExerciseImages[ex.name] = data.images || []; })
          ));

          this.ready = true;
          const start = new Date(this.session.started_at);
          this.elapsedSeconds = Math.floor((Date.now() - start.getTime()) / 1000);
          clearInterval(this.elapsedInterval);
          this.elapsedInterval = setInterval(() => this.elapsedSeconds++, 1000);
          this.loadExerciseImages();
          this.loadExerciseHistory();
          if (this.currentExercise) await this.loadExerciseNote(this.currentExercise.name);

          // Load saved exercise times and start tracking
          for (const et of (sessionRes.exercise_times || [])) {
            this.exerciseTimes[et.exercise_name] = et.duration_seconds;
          }
          this.startExerciseTimer();

          // Reload on bfcache restore so stale/frozen state never shows
          window.addEventListener('pageshow', (e) => { if (e.persisted) window.location.reload(); });

          const updateClock = () => { this.clockTime = new Date().toLocaleTimeString('hu', { hour: '2-digit', minute: '2-digit' }); };
          updateClock();
          setInterval(updateClock, 1000);
        },

        async switchExercise(i) {
          this.clearAutoAdvance();
          this.stopExerciseTimer();
          this.currentExerciseIndex = i;
          this.historyVisible = false;
          this.startExerciseTimer();
          this.loadExerciseImages();
          this.loadExerciseHistory();
          await this.loadExerciseNote(this.workout.exercises[i].name);
        },

        async loadExerciseNote(name) {
          try {
            const res = await fetch(`/api/exercises/${encodeURIComponent(name)}/note`);
            const data = await res.json();
            this.exerciseNote = data.note || '';
          } catch (e) {
            console.error('[note] load failed:', e);
            this.exerciseNote = '';
          }
        },

        async saveExerciseNote(name) {
          if (!name) return;
          this.noteSaving = true;
          try {
            await fetch(`/api/exercises/${encodeURIComponent(name)}/note`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ note: this.exerciseNote }),
            });
          } finally {
            this.noteSaving = false;
          }
        },

        async loadExerciseImages() {
          clearInterval(this.carouselInterval);
          this.carouselIndex = 0;
          if (!this.currentExercise) { this.exerciseImages = []; return; }
          const slug = this.slugify(this.currentExercise.name);
          const res = await fetch(`/api/exercises/${encodeURIComponent(this.currentExercise.name)}/images`).then(r => r.json());
          this.exerciseImages = res.images || [];
          if (this.exerciseImages.length > 1) this.startCarousel();
        },

        startCarousel() {
          clearInterval(this.carouselInterval);
          this.carouselInterval = setInterval(() => {
            this.carouselIndex = (this.carouselIndex + 1) % this.exerciseImages.length;
          }, 10000);
        },

        prevImage(e) {
          e?.stopPropagation();
          clearInterval(this.carouselInterval);
          this.carouselIndex = (this.carouselIndex - 1 + this.exerciseImages.length) % this.exerciseImages.length;
          if (this.exerciseImages.length > 1) this.startCarousel();
        },

        nextImage(e) {
          e?.stopPropagation();
          clearInterval(this.carouselInterval);
          this.carouselIndex = (this.carouselIndex + 1) % this.exerciseImages.length;
          if (this.exerciseImages.length > 1) this.startCarousel();
        },

        async loadExerciseHistory() {
          const ex = this.currentExercise;
          if (!ex) return;
          if (this.exerciseHistory[ex.name]) { this.$nextTick(() => this.renderHistoryChart()); return; }
          const res = await fetch(`/api/exercises/${encodeURIComponent(ex.name)}/history?limit=10`).then(r => r.json());
          this.exerciseHistory[ex.name] = res.history || [];
          this.$nextTick(() => this.renderHistoryChart());
        },

        renderHistoryChart() {
          const ex = this.currentExercise;
          if (!ex) return;
          if (this.historyChart) { this.historyChart.destroy(); this.historyChart = null; }
          const data = this.exerciseHistory[ex.name];
          if (!data || data.length === 0) return;
          const canvas = document.getElementById('hist-' + ex.name.replace(/\s/g, '-'));
          if (!canvas) return;
          this.historyChart = new Chart(canvas, {
            type: 'line',
            data: {
              labels: data.map(d => d.date),
              datasets: [{
                data: data.map(d => d.max_weight),
                borderColor: this.workout?.color || '#ef4444',
                backgroundColor: (this.workout?.color || '#ef4444') + '20',
                fill: true,
                tension: 0.3,
                pointRadius: 3,
                pointBackgroundColor: this.workout?.color || '#ef4444',
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: (ctx) => {
                      const d = data[ctx.dataIndex];
                      return `${d.max_weight}kg | 1RM: ${d.one_rm}kg`;
                    }
                  }
                }
              },
              scales: {
                x: { ticks: { color: '#52525b', font: { size: 10 } }, grid: { color: '#27272a' } },
                y: { ticks: { color: '#52525b', font: { size: 10 } }, grid: { color: '#27272a' }, beginAtZero: false }
              }
            }
          });
        },

        async uploadImage(event) {
          const file = event.target.files[0];
          if (!file || !this.currentExercise) return;
          this.uploading = true;
          const formData = new FormData();
          formData.append('image', file);
          await fetch(`/api/upload/${encodeURIComponent(this.currentExercise.name)}`, {
            method: 'POST', body: formData
          });
          event.target.value = '';
          await this.loadExerciseImages();
          this.uploading = false;
        },

        // Swipe-to-adjust weight
        _dragState: null,
        startDrag(e, si) {
          const set = this.exerciseSets[si];
          if (set.done) return;
          // Don't drag from inputs
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
          e.preventDefault();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          this._dragState = { si, startX: clientX, startWeight: set.weight, moved: false };
          set._dragX = 0; set._dragDelta = 0;

          const onMove = (ev) => {
            if (!this._dragState) return;
            const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
            const dx = cx - this._dragState.startX;
            if (Math.abs(dx) > 10) this._dragState.moved = true;
            if (!this._dragState.moved) return;
            const steps = Math.round(dx / 40);
            const s = this.exerciseSets[this._dragState.si];
            s._dragX = Math.max(-80, Math.min(80, dx * 0.3));
            s._dragDelta = steps;
          };
          const onEnd = () => {
            if (this._dragState) {
              const s = this.exerciseSets[this._dragState.si];
              if (this._dragState.moved && s._dragDelta) {
                s.weight = Math.max(0, this._dragState.startWeight + s._dragDelta * 2.5);
              }
              s._dragX = 0; s._dragDelta = 0;
              // Block click if we dragged
              if (this._dragState.moved) {
                this._blockClick = true;
                setTimeout(() => this._blockClick = false, 50);
              }
              this._dragState = null;
            }
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onEnd);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onEnd);
          document.addEventListener('touchmove', onMove, { passive: true });
          document.addEventListener('touchend', onEnd);
        },

        slugify(name) {
          return name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        },

        addSet() {
          const ex = this.currentExercise; if (!ex) return;
          const sets = this.allSets[ex.name]; const last = sets[sets.length - 1];
          sets.push({ weight: last ? last.weight : (ex.defaultWeight || 0), reps: last ? last.reps : (ex.defaultReps || 0), done: false, saved: false, isPr: false, saving: false, isWarmup: false });
        },

        goNextExercise() {
          this.clearAutoAdvance();
          const next = this.currentExerciseIndex + 1;
          if (next < this.workout.exercises.length) this.switchExercise(next);
        },

        startAutoAdvance() {
          clearInterval(this.autoAdvanceInterval);
          this.autoAdvanceSeconds = 5;
          this.autoAdvanceInterval = setInterval(() => {
            this.autoAdvanceSeconds--;
            if (this.autoAdvanceSeconds <= 0) {
              clearInterval(this.autoAdvanceInterval);
              this.autoAdvanceInterval = null;
              if (this.allExercisesDone) this.finishWorkout(true);
              else this.goNextExercise();
            }
          }, 1000);
        },

        clearAutoAdvance() {
          clearInterval(this.autoAdvanceInterval);
          this.autoAdvanceInterval = null;
          this.autoAdvanceSeconds = 0;
        },

        _blockClick: false,
        async toggleSet(si) {
          if (this._blockClick) return;
          const ex = this.currentExercise; const set = this.allSets[ex.name][si];
          if (set.saving) return;

          // Un-complete: remove saved set
          if (set.done) {
            this.clearAutoAdvance();
            if (set.saved && set.id) await fetch(`/api/sessions/${this.sessionId}/sets/${set.id}`, { method: 'DELETE' });
            set.done = false; set.saved = false; set.isPr = false; set.id = null;
            return;
          }

          // Complete set
          set.saving = true;

          const res = await fetch(`/api/sessions/${this.sessionId}/sets`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ exercise_name: ex.name, exercise_order: ex.order, equipment: ex.equipment, weight: set.weight, reps: set.reps, set_number: si + 1, is_warmup: set.isWarmup })
          }).then(r => r.json());

          set.done = true; set.saved = true; set.saving = false; set.isPr = res.isNewPr; set.id = res.set.id;
          if (res.isNewPr) { this.showPrToast = true; setTimeout(() => this.showPrToast = false, 3000); }

          // Start rest timer after each completed set
          if (this.allCurrentSetsDone && this.allExercisesDone) {
            this.finishWorkout(false);
          } else {
            this.startRest(ex.restSeconds || this.workout.defaultRestSeconds || 90);
            // All sets done for this exercise — switch to next, rest timer keeps running
            if (this.allCurrentSetsDone) setTimeout(() => this.goNextExercise(), 2000);
          }
        },

        getCompletedCount(i) {
          const ex = this.workout?.exercises?.[i];
          return (this.allSets[ex?.name] || []).filter(s => s.done).length;
        },
        isExerciseDone(i) {
          const ex = this.workout?.exercises?.[i];
          const sets = (this.allSets[ex?.name] || []).filter(s => !s.isWarmup);
          return sets.length > 0 && sets.every(s => s.done);
        },

        async removeSet(si) {
          const ex = this.currentExercise; const sets = this.allSets[ex.name]; const set = sets[si];
          if (set.saved && set.id) await fetch(`/api/sessions/${this.sessionId}/sets/${set.id}`, { method: 'DELETE' });
          sets.splice(si, 1);
          if (sets.length === 0) sets.push({ weight: ex.defaultWeight || 0, reps: ex.defaultReps || 0, done: false, saved: false, isPr: false, saving: false, isWarmup: false });
        },

        startExerciseTimer() {
          const ex = this.currentExercise;
          if (!ex) return;
          this.exerciseStartedAt = Date.now();
          this.exerciseElapsed = this.exerciseTimes[ex.name] || 0;
          clearInterval(this.exerciseTimerInterval);
          this.exerciseTimerInterval = setInterval(() => {
            this.exerciseElapsed = (this.exerciseTimes[ex.name] || 0) + Math.floor((Date.now() - this.exerciseStartedAt) / 1000);
          }, 1000);
        },

        stopExerciseTimer() {
          clearInterval(this.exerciseTimerInterval);
          const ex = this.currentExercise;
          if (!ex || !this.exerciseStartedAt) return;
          this.exerciseTimes[ex.name] = (this.exerciseTimes[ex.name] || 0) + Math.floor((Date.now() - this.exerciseStartedAt) / 1000);
          this.exerciseStartedAt = null;
          this.saveExerciseTime(ex.name, this.exerciseTimes[ex.name]);
        },

        async saveExerciseTime(name, seconds) {
          fetch(`/api/sessions/${this.sessionId}/exercise-time`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ exercise_name: name, duration_seconds: seconds })
          });
        },

        beep(count = 1, dur = 150, lastDur = null) {
          try {
            const ctx = new AudioContext();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.value = 880; g.gain.value = 0.3;
            o.start();
            setTimeout(() => { o.stop(); ctx.close(); }, count === 1 && lastDur ? lastDur : dur);
            for (let i = 1; i < count; i++) {
              setTimeout(() => {
                const isLast = i === count - 1;
                const c2 = new AudioContext();
                const o2 = c2.createOscillator(); const g2 = c2.createGain();
                o2.connect(g2); g2.connect(c2.destination);
                o2.frequency.value = 880; g2.gain.value = 0.3;
                o2.start();
                setTimeout(() => { o2.stop(); c2.close(); }, isLast && lastDur ? lastDur : dur);
              }, i * (dur + 150));
            }
          } catch (e) {}
        },
        startRest(s) {
          clearInterval(this.timerInterval); this.timerSeconds = s; this.timerTotal = s; this.timerRunning = true;
          this.timerInterval = setInterval(() => {
            this.timerSeconds--;
            if (this.timerSeconds === 10) this.beep(1);
            if (this.timerSeconds === 5) this.beep(2);
            if (this.timerSeconds <= 0) this.endRest();
          }, 1000);
        },
        skipRest() { clearInterval(this.timerInterval); this.endRest(); },
        endRest() {
          clearInterval(this.timerInterval); this.timerRunning = false;
          this.beep(3, 150, 500);
          if (this.allCurrentSetsDone) this.startAutoAdvance();
        },

        async finishWorkout(skipConfirm = false) {
          if (this.finishing) return;
          if (!skipConfirm && !confirm('Befejezed az edzest?')) return;
          this.finishing = true;
          this.clearAutoAdvance();
          this.stopExerciseTimer();
          await fetch(`/api/sessions/${this.sessionId}/finish`, { method: 'PUT' }).then(r => r.json());
          clearInterval(this.elapsedInterval);
          window.location.replace(`/summary.html?id=${this.sessionId}`);
        },
        async discardWorkout() {
          if (!confirm('Eldobod az egesz edzest?')) return;
          await fetch(`/api/sessions/${this.sessionId}`, { method: 'DELETE' });
          clearInterval(this.elapsedInterval);
          window.location.href = '/';
        },
        formatDuration(s) {
          const h = Math.floor(s / 3600);
          const m = Math.floor((s % 3600) / 60);
          const sec = s % 60;
          if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
          return `${m}:${sec.toString().padStart(2, '0')}`;
        }
      };
    }
  </script>
