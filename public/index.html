<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Workout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'IBM Plex Mono', monospace; }
    .font-display { font-family: 'Oswald', sans-serif; }
    .card-glow:hover { box-shadow: 0 0 30px -10px var(--glow); }
    .bg-noise {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.4s ease-out both; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen bg-noise" x-data="dashboardApp()" x-init="init()">

  <!-- Header -->
  <header class="border-b border-zinc-800">
    <div class="max-w-5xl mx-auto px-6 py-6 flex items-end justify-between">
      <div>
        <h1 class="font-display text-5xl font-700 uppercase tracking-tight leading-none">Open<br><span class="text-zinc-500">Workout</span></h1>
        <div class="h-0.5 w-16 bg-red-500 mt-3"></div>
      </div>
      <nav class="flex gap-1">
        <a href="/calendar.html" class="px-4 py-2 text-xs font-medium uppercase tracking-widest text-zinc-500 hover:text-zinc-100 hover:bg-zinc-800 rounded transition">Naptar</a>
        <a href="/history.html" class="px-4 py-2 text-xs font-medium uppercase tracking-widest text-zinc-500 hover:text-zinc-100 hover:bg-zinc-800 rounded transition">Tortenet</a>
      </nav>
    </div>
  </header>

  <!-- Workout cards -->
  <main class="max-w-5xl mx-auto px-6 py-10">
    <div class="flex items-center gap-3 mb-6">
      <h2 class="text-xs font-medium uppercase tracking-[0.2em] text-zinc-600">Valassz edzestipust</h2>
      <div class="flex-1 h-px bg-zinc-800"></div>
      <span class="text-[9px] uppercase tracking-[0.15em] text-green-400 bg-green-400/10 px-2.5 py-1 rounded border border-green-400/25" x-text="'Kovetkezo: #' + (nextIndex + 1)"></span>
    </div>

    <!-- Muscle group counts -->
    <div class="flex flex-wrap gap-2 mb-8" x-show="Object.keys(muscleGroupCounts).length">
      <template x-for="[mg, count] in Object.entries(muscleGroupCounts)" :key="mg">
        <span class="text-[10px] uppercase tracking-wider text-zinc-400 border border-zinc-800 rounded-full px-3 py-1 bg-zinc-900/60">
          <span x-text="mg"></span> <span class="text-zinc-600" x-text="'· ' + count"></span>
        </span>
      </template>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <template x-for="(w, i) in workouts" :key="w.id">
        <div @click="startWorkout(w.id)"
             class="card-glow animate-slide-up group cursor-pointer border rounded-lg overflow-hidden transition-all duration-300"
             :class="isNext(i) ? 'border-2 hover:border-opacity-80' : 'border-zinc-800 hover:border-zinc-600'"
             :style="isNext(i)
               ? `--glow: ${w.color || '#ef4444'}; border-color: ${w.color || '#ef4444'}80; animation-delay: ${i * 80}ms; box-shadow: 0 0 40px -15px ${(w.color || '#ef4444')}40`
               : `--glow: ${w.color || '#ef4444'}; opacity: ${hasAnyActive ? '1' : '0.55'}; animation-delay: ${i * 80}ms`">
          <!-- Color accent bar -->
          <div class="h-1" :style="`background: ${w.color || '#ef4444'}`"></div>
          <div class="p-6 bg-zinc-900/80">
            <div class="flex items-start justify-between mb-4">
              <div class="flex items-center gap-3">
                <span class="font-display text-2xl font-700 leading-none w-10 h-10 flex items-center justify-center rounded-lg"
                      :style="`color: ${w.color || '#ef4444'}; background: ${w.color || '#ef4444'}15`"
                      x-text="w.order || (i + 1)"></span>
                <div>
                  <h3 class="font-display text-2xl font-600 uppercase tracking-wide" x-text="w.name"></h3>
                  <span x-show="isNext(i)" class="text-[9px] uppercase tracking-[0.15em] text-green-400 mt-0.5">Kovetkezo edzes</span>
                </div>
              </div>
              <span class="text-[10px] uppercase tracking-widest text-zinc-600 border border-zinc-700 px-2 py-0.5 rounded" x-text="w.exercises.length + ' gyakorlat'"></span>
            </div>
            <!-- Exercise preview (collapsible) -->
            <div x-data="{ open: false }" class="mb-6">
              <button @click.stop="open = !open" class="flex items-center gap-2 text-[10px] uppercase tracking-widest text-zinc-500 hover:text-zinc-300 transition mb-2">
                <svg :class="open && 'rotate-90'" class="w-3 h-3 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                Gyakorlatok
              </button>
              <div x-show="open" x-collapse class="space-y-2">
                <template x-for="ex in w.exercises" :key="ex.order">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded bg-zinc-800 flex-shrink-0 overflow-hidden relative flex items-center justify-center">
                      <img x-show="exerciseImages[ex.name]?.length > 0"
                           :src="exerciseImages[ex.name]?.[0]?.url"
                           class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition">
                      <img x-show="!(exerciseImages[ex.name]?.length > 0) && ex.image"
                           :src="ex.image" class="w-6 h-6 opacity-60 group-hover:opacity-100 transition"
                           :style="`color: ${w.color || '#ef4444'}`">
                      <span x-show="!(exerciseImages[ex.name]?.length > 0) && !ex.image"
                            class="text-[10px] text-zinc-600 font-medium" x-text="ex.order"></span>
                    </div>
                    <span class="text-sm text-zinc-500 group-hover:text-zinc-300 transition" x-text="ex.name"></span>
                    <div class="flex gap-1 flex-wrap">
                      <template x-for="mg in (ex.muscleGroups || [])" :key="mg">
                        <span class="text-[9px] uppercase tracking-wider text-zinc-500 border border-zinc-700 rounded px-1.5 py-0.5" x-text="mg"></span>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
            <template x-if="activeSessions[w.id]">
              <div class="space-y-2">
                <div class="flex items-center gap-2 text-[10px] uppercase tracking-widest text-amber-400">
                  <div class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></div>
                  Folyamatban
                </div>
                <button @click="resumeWorkout(w.id)"
                        class="w-full py-2.5 text-xs font-medium uppercase tracking-widest rounded transition-all duration-200 border"
                        :style="`border-color: ${w.color || '#ef4444'}; color: ${w.color || '#ef4444'}; background: ${w.color || '#ef4444'}15`"
                        @mouseover="$el.style.background = (w.color || '#ef4444'); $el.style.color = '#000'"
                        @mouseout="$el.style.background = (w.color || '#ef4444') + '15'; $el.style.color = (w.color || '#ef4444')">
                  Folytatás
                </button>
              </div>
            </template>
            <template x-if="!activeSessions[w.id]">
              <button @click.stop="startWorkout(w.id)"
                      :disabled="hasAnyActive"
                      class="w-full py-2.5 text-xs font-medium uppercase tracking-widest rounded transition-all duration-200 border disabled:opacity-30 disabled:cursor-not-allowed"
                      :style="isNext(i) ? `border-color: ${w.color || '#ef4444'}; color: ${w.color || '#ef4444'}; background: ${(w.color || '#ef4444')}15` : `border-color: ${(w.color || '#ef4444')}40; color: ${w.color || '#ef4444'}`"
                      @mouseover="if(!hasAnyActive){ $el.style.background = (w.color || '#ef4444'); $el.style.color = '#000' }"
                      @mouseout="if(!hasAnyActive){ $el.style.background = isNext(i) ? (w.color || '#ef4444') + '15' : 'transparent'; $el.style.color = (w.color || '#ef4444') }">
                Inditas
              </button>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- Stats section -->
    <div class="mt-14" x-show="stats">
      <div class="flex items-center gap-3 mb-6">
        <h2 class="text-xs font-medium uppercase tracking-[0.2em] text-zinc-600">Statisztikak</h2>
        <div class="flex-1 h-px bg-zinc-800"></div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Weekly activity -->
        <div class="border border-zinc-800 rounded-lg p-5 bg-zinc-900/80">
          <h3 class="text-[10px] uppercase tracking-widest text-zinc-500 mb-4">Heti edzesek</h3>
          <div class="h-48"><canvas id="chartWeekly"></canvas></div>
        </div>
        <!-- Volume progression -->
        <div class="border border-zinc-800 rounded-lg p-5 bg-zinc-900/80">
          <h3 class="text-[10px] uppercase tracking-widest text-zinc-500 mb-4">Osszsuly (kg)</h3>
          <div class="h-48"><canvas id="chartVolume"></canvas></div>
        </div>
        <!-- Workout distribution -->
        <div class="border border-zinc-800 rounded-lg p-5 bg-zinc-900/80">
          <h3 class="text-[10px] uppercase tracking-widest text-zinc-500 mb-4">Edzes tipusok</h3>
          <div class="h-48 flex items-center justify-center"><canvas id="chartDist"></canvas></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function dashboardApp() {
      return {
        workouts: [],
        exerciseImages: {},
        activeSessions: {},
        nextIndex: 0,
        stats: null,
        async init() {
          const [rotation, active] = await Promise.all([
            fetch('/api/workouts/rotation').then(r => r.json()),
            fetch('/api/sessions/active').then(r => r.json())
          ]);
          this.workouts = rotation.workouts;
          this.nextIndex = rotation.nextIndex;
          this.activeSessions = Object.fromEntries(active.map(s => [s.workout_id, s]));
          const allExercises = this.workouts.flatMap(w => w.exercises);
          await Promise.all(allExercises.map(ex =>
            fetch(`/api/exercises/${encodeURIComponent(ex.name)}/images`).then(r => r.json())
              .then(data => { this.exerciseImages[ex.name] = data.images || []; })
          ));
          // Load stats
          this.stats = await fetch('/api/stats').then(r => r.json());
          this.$nextTick(() => this.renderCharts());
        },
        renderCharts() {
          if (!this.stats) return;
          const gridColor = '#27272a';
          const textColor = '#71717a';
          const defaults = Chart.defaults;
          defaults.color = textColor;
          defaults.font.family = "'IBM Plex Mono', monospace";
          defaults.font.size = 10;

          // Weekly activity bar chart
          const wk = this.stats.weekly;
          new Chart(document.getElementById('chartWeekly'), {
            type: 'bar',
            data: {
              labels: wk.map(r => { const d = new Date(r.week); return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }),
              datasets: [{
                data: wk.map(r => Number(r.count)),
                backgroundColor: '#ef444480',
                borderColor: '#ef4444',
                borderWidth: 1,
                borderRadius: 3
              }]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { color: gridColor }, ticks: { color: textColor } },
                y: { grid: { color: gridColor }, ticks: { color: textColor, stepSize: 1 }, beginAtZero: true }
              }
            }
          });

          // Volume line chart
          const vol = this.stats.volume;
          new Chart(document.getElementById('chartVolume'), {
            type: 'line',
            data: {
              labels: vol.map(r => { const d = new Date(r.date); return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }),
              datasets: [{
                data: vol.map(r => Number(r.total_weight)),
                borderColor: '#22c55e',
                backgroundColor: '#22c55e20',
                fill: true,
                tension: 0.3,
                pointRadius: 3,
                pointBackgroundColor: '#22c55e'
              }]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { color: gridColor }, ticks: { color: textColor } },
                y: { grid: { color: gridColor }, ticks: { color: textColor } }
              }
            }
          });

          // Distribution doughnut
          const dist = this.stats.distribution;
          new Chart(document.getElementById('chartDist'), {
            type: 'doughnut',
            data: {
              labels: dist.map(r => r.name),
              datasets: [{
                data: dist.map(r => Number(r.count)),
                backgroundColor: dist.map(r => r.color + '99'),
                borderColor: dist.map(r => r.color),
                borderWidth: 1
              }]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: {
                legend: { position: 'right', labels: { color: textColor, padding: 12, font: { size: 10 } } }
              }
            }
          });
        },
        resumeWorkout(workoutId) {
          const session = this.activeSessions[workoutId];
          if (session) window.location.href = `/workout.html?id=${session.id}`;
        },
        get muscleGroupCounts() {
          const counts = {};
          for (const w of this.workouts) {
            for (const ex of w.exercises) {
              for (const mg of ex.muscleGroups || []) counts[mg] = (counts[mg] || 0) + 1;
            }
          }
          return counts;
        },
        get hasAnyActive() {
          return Object.keys(this.activeSessions).length > 0;
        },
        get isNext() {
          return (index) => index === this.nextIndex && !this.hasAnyActive;
        },
        async startWorkout(workoutId) {
          if (this.hasAnyActive) return;
          const res = await fetch('/api/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ workout_id: workoutId })
          }).then(r => r.json());
          window.location.href = `/workout.html?id=${res.id}`;
        }
      };
    }
  </script>
</body>
</html>
