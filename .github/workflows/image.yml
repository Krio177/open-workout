# Build the image when a version tag (v1.2.3) is pushed and publish it to GitHub Container Registry:
#   ghcr.io/krio177/open-workout
# Tags: the git tag (e.g. v1.2.3) + latest. Release: git tag v1.2.3 && git push origin v1.2.3
name: image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64 # the cluster's Talos nodes are all amd64
          tags: |
            ghcr.io/krio177/open-workout:latest
            ghcr.io/krio177/open-workout:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
